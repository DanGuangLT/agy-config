name: Validate

on:
  pull_request:
  push:
    branches:
      - main
      - 'update/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - name: Validate repository
        run: |
          .\tests\Validate-Repo.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install PSScriptAnalyzer
        run: Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
      - name: Analyze scripts
        run: |
          $issues = @(Invoke-ScriptAnalyzer -Path scripts -Recurse -Severity Error)
          $issues
          if ($issues.Count -gt 0) { throw 'PSScriptAnalyzer reported errors.' }
      - name: Run Pester tests
        run: |
          .\tests\Invoke-Tests.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
